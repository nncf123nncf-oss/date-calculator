<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日付計算ツール</title>
  <style>
    :root {
      color-scheme: light;
      --background: #5B356E;
      --surface: #FFFFFF;
      --on-background: #F3EFF5;
      --text: #241E29;
      --muted: #615A66;
      --accent: #2D7652;
      --danger: #B3261E;
      --border: #D2CBD6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 0;
      background: var(--background);
      color: var(--on-background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100% - 24px, 480px);
      margin: 0 auto;
      padding: 24px 0;
    }

    h1 { margin: 0; font-size: 18px; line-height: 1.4; }
    .intro { margin: 8px 0 24px; color: var(--on-background); font-size: 14px; }

    .panel {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }

    .panel + .panel { margin-top: 16px; }
    h2 { margin: 0 0 16px; font-size: 15px; line-height: 1.4; }

    .field + .field { margin-top: 12px; }
    label, .field-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 14px; }
    input { width: 100%; min-height: 40px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); background: #fff; font: inherit; font-size: 16px; }
    input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, white); outline-offset: 1px; border-color: var(--accent); }

    .choice-row { display: flex; flex-wrap: wrap; gap: 16px; }
    .choice-row label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--text); }
    .choice-row input { width: 18px; min-height: 18px; accent-color: var(--accent); }

    .result { min-height: 60px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 20px; font-weight: 700; }
    .result-detail { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .is-hidden { display: none; }

    .error-area { min-height: 32px; margin-top: 16px; padding: 0 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--danger); font-size: 14px; line-height: 30px; }
    .error-area:empty { visibility: hidden; }
  </style>
</head>
<body>
  <main>
    <h1>日付計算ツール</h1>
    <p class="intro">2つの日付の間の日数と、基準日からの前後の日付をすぐに計算します</p>

    <section class="panel" aria-labelledby="difference-heading">
      <h2 id="difference-heading">日付の間の日数</h2>
      <div class="field"><label for="start-date">開始日</label><input id="start-date" type="date"></div>
      <div class="field"><label for="end-date">終了日</label><input id="end-date" type="date"></div>
      <output id="difference-result" class="result" aria-live="polite"></output>
    </section>

    <section class="panel" aria-labelledby="offset-heading">
      <h2 id="offset-heading">基準日からの日付</h2>
      <div class="field"><label for="base-date">基準日</label><input id="base-date" type="date"></div>
      <div class="field"><label for="days">日数</label><input id="days" type="number" min="0" step="1" inputmode="numeric" value="0"></div>
      <div class="field"><span class="field-label">前後</span><div class="choice-row"><label><input type="radio" name="direction" value="after" checked>後</label><label><input type="radio" name="direction" value="before">前</label></div></div>
      <output id="offset-result" class="result" aria-live="polite"></output>
    </section>

    <div id="error-area" class="error-area" role="alert" aria-live="assertive"></div>
  </main>

  <script>
    const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
    const startDate = document.querySelector('#start-date');
    const endDate = document.querySelector('#end-date');
    const baseDate = document.querySelector('#base-date');
    const days = document.querySelector('#days');
    const differenceResult = document.querySelector('#difference-result');
    const offsetResult = document.querySelector('#offset-result');
    const errorArea = document.querySelector('#error-area');

    function todayString() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 10);
    }

    function toUtcNoon(value) {
      const [year, month, day] = value.split('-').map(Number);
      return new Date(Date.UTC(year, month - 1, day, 12));
    }

    function formatJapaneseDate(date) {
      return `${date.getUTCFullYear()}年${date.getUTCMonth() + 1}月${date.getUTCDate()}日（${weekdays[date.getUTCDay()]}）`;
    }

    function setError(message) { errorArea.textContent = message ? `⚠ ${message}` : ''; }

    function updateDifference() {
      if (!startDate.value || !endDate.value) return;
      const start = toUtcNoon(startDate.value);
      const end = toUtcNoon(endDate.value);
      if (end < start) {
        differenceResult.classList.add('is-hidden');
        setError('終了日は開始日より後の日付にしてください');
        return;
      }
      const difference = Math.round((end - start) / 86400000);
      differenceResult.classList.remove('is-hidden');
      differenceResult.innerHTML = `${difference}日間<span class="result-detail">開始日：${formatJapaneseDate(start)} ／ 終了日：${formatJapaneseDate(end)}</span>`;
    }

    function updateOffset() {
      const dayCount = days.value;
      if (!baseDate.value || dayCount === '' || !Number.isInteger(Number(dayCount)) || Number(dayCount) < 0) {
        offsetResult.classList.add('is-hidden');
        setError('日数は0以上の整数を入力してください');
        return;
      }
      const result = toUtcNoon(baseDate.value);
      const multiplier = document.querySelector('input[name="direction"]:checked').value === 'after' ? 1 : -1;
      result.setUTCDate(result.getUTCDate() + Number(dayCount) * multiplier);
      offsetResult.classList.remove('is-hidden');
      offsetResult.textContent = formatJapaneseDate(result);
    }

    function updateAll() {
      setError('');
      updateDifference();
      const differenceError = errorArea.textContent;
      updateOffset();
      if (differenceError && !errorArea.textContent) errorArea.textContent = differenceError;
    }

    const inputs = document.querySelectorAll('input');
    inputs.forEach((input) => { input.addEventListener('input', updateAll); input.addEventListener('change', updateAll); });
    const today = todayString();
    startDate.value = today;
    endDate.value = today;
    baseDate.value = today;
    updateAll();
  </script>
</body>
</html>
